name: Publish LitDelta preview

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: litdelta-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
      - run: python -m pip install .
      - run: python scripts/build_preview.py --out output/litdelta-preview
      - uses: actions/upload-pages-artifact@v4
        with:
          path: output/litdelta-preview
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the checked preview
        id: deployment
        uses: actions/deploy-pages@v4
