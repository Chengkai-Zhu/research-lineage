name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check src tests scripts skills
      - run: python -m pytest --cov=research_lineage --cov-report=term-missing --cov-report=xml
      - run: python -m research_lineage demo --out output/demo
      - name: Build authored histories and evaluation reports
        run: |
          python -m research_lineage build examples/nmt-attention/map.json --out output/nmt
          python -m research_lineage build examples/surface-code/map.json --out output/surface-code
          python -m research_lineage build docs/test-reports/surface-code-rerun/map.json --out output/surface-code-expanded
          python scripts/check_research_controls.py docs/test-reports/surface-code-rerun/manifest.json
          python -m research_lineage evaluate examples/evaluation/gates.json --out output/gate-report.json
          python -m research_lineage study examples/evaluation/study-empty.json --out output/study-report.json
      - run: python scripts/package_skill.py --out dist
      - run: python -m build
      - uses: codecov/codecov-action@v7.1.1
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        with:
          files: coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
      - uses: actions/upload-artifact@v7.0.2
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        with:
          name: research-lineage-release-candidate
          path: |
            dist/
            output/
            coverage.xml
